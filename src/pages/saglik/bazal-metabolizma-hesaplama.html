<body>

  <hesaplayicim-header></hesaplayicim-header>

    <main>
      <div class="main">

        <div class="flex flex-col gap-30">
            <h1 class="center-text">Bazal Metabolizma Hesaplama</h1>
            <h2 class="center-text">Sağlık</h2>
        </div>
 
        <div class="calculator-container">
            <form id="bazal-metabolizma"> 

                <div class="flex flex-col gap-30">
                    <div class="flex flex-col gap-30">
                        <div class="flex flex-row justify-center items-center gap-30 stack-mobile">
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="cinsiyet">Cinsiyet</label>
                                <select required id="cinsiyet">
                                    <option value="">Cinsiyet Seçiniz</option>
                                    <option value="erkek">Erkek</option>
                                    <option value="kadin">Kadın</option>
                                </select>                                
                            </div>
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="yas">Yaş</label>
                                <input id="yas" type="number" placeholder="Yaşınızı giriniz." required>
                            </div>
                        </div>
                        <div class="flex flex-row justify-center items-center gap-30 stack-mobile">
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="kilo">Kilo</label>
                                <input id="kilo" type="number" placeholder="Kilonuzu giriniz.(kg)" required>
                            </div>
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="boy">Boy</label>
                                <input id="boy" type="number" placeholder="Boyunuzu girinz.(cm)" required>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-30">
                        <div class="flex flex-row justify-center items-center gap-30" id="result-btns">
                            <button id="result-btn" type="submit" class="btn btn--accent">Hesapla</button>
                            <button id="reset-btn" type="button" class="btn btn--outline">Sıfırla</button>                            
                        </div>
                    </div>

                    <div class="flex flex-col gap-30" id="result-area">
                        <div class="flex flex-row justify-center items-center gap-30" id="result-group">
                            <span>Sonuç</span>
                            <button title="Kopyala" type="button" class="btn btn--copy"><img src="/src/assets/icons/solar_copy-bold.svg" alt="kopyalama-butonu"></button>
                        </div>
                        <output id="result"></output>
                    </div>
                </div>
            </form>
        </div>

        
           
      </div>



    </main>

    <hesaplayicim-footer></hesaplayicim-footer>

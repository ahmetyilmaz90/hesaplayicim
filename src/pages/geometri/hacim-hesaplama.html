    <title>Hacim Hesaplama - Hesaplayıcım</title>

</head>
<body>
  <hesaplayicim-header></hesaplayicim-header>

    <main>
      <div class="main">
        <div class="flex flex-col gap-30">
            <h1 class="center-text">Hacim Hesaplama</h1>
            <h2 class="center-text">Geometri</h2>
        </div>

        <div class="calculator-container">
            <form id="hacim-hesaplama">

                <div class="flex flex-col gap-30">
                    <div class="flex flex-col gap-30">
                        <div class="flex flex-col gap-5">
                            <label for="methot">Şekil Seçiniz</label>
                            <select required id="methot">
                                <option value="">Şekil Seçiniz...</option>
                                <option value="prizmasi">Dikdörtgenler Prizması</option>
                                <option value="kup">Küp</option>
                                <option value="silindir">Silindir</option>
                                <option value="kure">Küre</option>
                                <option value="koni">Koni</option>
                                <option value="piramit">Piramit</option>
                            </select>
                        </div>
                        <div class="flex flex-row justify-center items-center gap-30 stack-mobile">
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="sayi1">Şekil Seçiniz</label>
                                <input min="0" id="sayi1" type="number" placeholder="Şekil seçiniz..." required>
                            </div>
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="sayi2">Şekil Seçiniz</label>
                                <input min="0" id="sayi2" type="number" placeholder="Şekil seçiniz..." required>
                            </div>
                        </div>
                        <div class="flex flex-row justify-center items-center gap-30">
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="sayi3">Şekil Seçiniz</label>
                                <input min="0" class="mini-inpt" id="sayi3" type="number" placeholder="Şekil seçiniz...">
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-30">
                        <div class="flex flex-row justify-center items-center gap-30" id="result-btns">
                            <button type="submit" id="result-btn" class="btn btn--accent">Hesapla</button>
                            <button type="button" id="reset-btn" class="btn btn--outline">Sıfırla</button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-30" id="result-area">
                        <div class="flex flex-row justify-center items-center gap-30" id="result-group">
                            <span>Sonuç</span>
                            <button title="Kopyala" type="button" class="btn btn--copy"><img src="/src/assets/icons/solar_copy-bold.svg" alt="kopyalama-butonu"></button>
                        </div>
                        <output id="result"></output>
                    </div>
                </div>

            </form>
        </div>


           
      </div>



    </main>

    <hesaplayicim-footer></hesaplayicim-footer>
    
    <script type="module" src="/src/js/index.js"></script>
    <script src="/src/js/geometry/hacim.js"></script>
</body>
</html>

    <!-- Sayfa açıklamasını yapıyoruz -->
    <meta name="description" content="Hipotenüs hesaplama aracıyla dik üçgende kenar uzunluğu veya hipotenüsü kolayca bulun.">

    <!--Favicon dahil ediyoruz-->
    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/icons/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/src/assets/icons/favicon-16x16.png">

    <!--Components-->
    <script src="/src/pages/components/header.js" defer></script>
    <script src="/src/pages/components/footer.js" defer></script>



    <link rel="stylesheet" href="/src/css/styles.css">

    <title>Hipotenüs Hesaplama - Hesaplayıcım</title>
</head>
<body>

  <hesaplayicim-header></hesaplayicim-header>

    <main>
      <div class="main">
        <div class="flex flex-col gap-30">
            <h1 class="center-text">Hipotenüs Hesaplama</h1>
            <h2 class="center-text">Geometri</h2>
        </div>

        <div class="calculator-container" >
            <form id="hipotenus-hesaplama">

                <div class="flex flex-col gap-30">
                    <div class="flex flex-col gap-30">
                        <div class="flex flex-row justify-center items-center gap-30 stack-mobile">
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="methot">İşlem Seçiniz</label>
                                <select id="methot">
                                    <option value="hipotenus-hesapla">Hipotenüs Hesapla</option>
                                    <option value="kenar-hesapla">Kenar Hesapla</option>
                                </select>
                            </div>

                            <div class="flex flex-col flex-1 gap-5">
                                <label for="cikti-bicimi">Sonuç Biçimi</label>
                                <select id="cikti-bicimi">
                                    <option value="gercek">Gerçek Sonuç</option>
                                    <option value="karekok">Kareköklü Sonuç</option>
                                </select>
                            </div>
                        </div>

                        <div class="flex flex-row justify-center items-center gap-30 stack-mobile">
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="kenar1">1.Kenar</label>
                                <input min="0" placeholder="1.Kenar uzunluğu giriniz." id="kenar1" type="number" required>
                            </div>
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="kenar2-hipotenus">2.Kenar</label>
                                <input min="0" placeholder="2.Kenar uzunluğu giriniz." id="kenar2-hipotenus" type="number" required>
                            </div>
                        </div>
                    </div>

                    <div class="flex flex-col gap-30">
                        <div class="flex flex-row justify-center items-center gap-30" id="result-btns">
                            <button type="submit" id="result-btn" class="btn btn--accent">Hesapla</button>
                            <button type="button" id="reset-btn" class="btn btn--outline">Sıfırla</button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-30" id="result-area">
                        <div class="flex flex-row justify-center items-center gap-30" id="result-group">
                            <span>Sonuç</span>
                            <button title="Kopyala" type="button" class="btn btn--copy"><img src="/src/assets/icons/solar_copy-bold.svg" alt="kopyalama-butonu"></button>
                        </div>
                        <output id="result"></output>
                    </div>
                </div>

            </form>
        </div>


           
      </div>



    </main>

    <hesaplayicim-footer></hesaplayicim-footer>
    
    <script type="module" src="/src/js/index.js"></script>
    <script src="/src/js/geometry/hipotenus.js"></script>
</body>
</html>

    <link rel="icon" type="image/png" sizes="32x32" href="/src/assets/icons/favicon-32x32.png">

    <script src="/src/pages/components/footer.js" defer></script>



    <link rel="stylesheet" href="/src/css/styles.css">

    <title>Uzunluk Dönüştürme - Hesaplayıcım</title>

</head>
<body>
  <hesaplayicim-header></hesaplayicim-header>

    <main>
      <div class="main">
        <div class="flex flex-col gap-30">
            <h1 class="center-text">Uzunluk Dönüştürme</h1>
            <h2 class="center-text">Fizik</h2>
        </div>

        <div class="calculator-container">
            <form id="uzunluk-donusturme">

                <div class="flex flex-col gap-30">
                    <div class="flex flex-col gap-30">
                        <div class="flex flex-row justify-center items-center gap-30 stack-mobile">
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="suanki-birim">Şu Anki Birim</label>
                                <select id="suanki-birim">
                                    <option value="micrometre">Mikrometre (µm)</option>
                                    <option value="mm">Milimetre (mm)</option>
                                    <option value="cm">Santimetre (cm)</option>
                                    <option value="m">Metre (m)</option>
                                    <option value="km">Kilometre (km)</option>
                                    <option value="inch">İnç (In)</option>
                                    <option value="ft">Foot (ft)</option>
                                    <option value="mil">Mil</option>
                                </select>
                            </div>
                            <div class="flex flex-col flex-1 gap-5">
                                <label for="donusecek-birim">Dönüşecek Birim</label>
                                <select id="donusecek-birim">
                                    <option value="micrometre">Mikrometre (µm)</option>
                                    <option value="mm">Milimetre (mm)</option>
                                    <option value="cm">Santimetre (cm)</option>
                                    <option value="m">Metre (m)</option>
                                    <option value="km">Kilometre (km)</option>
                                    <option value="inch">İnç (In)</option>
                                    <option value="ft">Foot (ft)</option>
                                    <option value="mil">Mil</option>
                                </select>
                            </div>
                        </div>
                        <div class="flex flex-col gap-5">
                            <label for="sayi">Dönüştürülecek Uzunluk</label>
                            <input type="number" id="sayi" placeholder="Birimi değişecek uzunluğu yazınız." required>
                        </div>
                    </div>

                    <div class="flex flex-col gap-30">
                        <div class="flex flex-row justify-center items-center gap-30" id="result-btns">
                            <button type="submit" id="result-btn" class="btn btn--accent">Hesapla</button>
                            <button type="button" id="reset-btn" class="btn btn--outline">Sıfırla</button>
                        </div>
                    </div>

                    <div class="flex flex-col gap-30" id="result-area">
                        <div class="flex flex-row justify-center items-center gap-30" id="result-group">
                            <span>Sonuç</span>
                            <button title="Kopyala" type="button" class="btn btn--copy"><img src="/src/assets/icons/solar_copy-bold.svg" alt="kopyalama-butonu"></button>
                        </div>
                        <output id="result"></output>
                    </div>
                </div>

            </form>
        </div>


           
      </div>



    </main>

    <hesaplayicim-footer></hesaplayicim-footer>
    
    <script type="module" src="/src/js/index.js"></script>
    <script src="/src/js/physic/uzunluk.js"></script>
</body>
</html>
